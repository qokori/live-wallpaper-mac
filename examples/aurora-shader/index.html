<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aurora shader</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050814; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas></canvas>
<script>
// Flowing aurora bands from layered value noise, with a soft glow that follows the pointer.
// ?scale=1 (default) draws one shader pixel per CSS pixel, a quarter of the pixels of a Retina screen;
// the picture is soft by nature, so this saves most of the GPU work. ?scale=2 draws at full Retina resolution.
const canvas = document.querySelector('canvas');
const scale = Math.min(Math.max(Number(new URLSearchParams(location.search).get('scale')) || 1, 0.25), 2);
const gl = canvas.getContext('webgl', { alpha: false, antialias: false, depth: false, powerPreference: 'low-power' });

const vertexSource = `
attribute vec2 position;
void main() { gl_Position = vec4(position, 0.0, 1.0); }`;

const fragmentSource = `
precision mediump float;
uniform vec2 resolution;
uniform float time;
uniform vec2 pointer;

float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x),
             mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y);
}

float fbm(vec2 p) {
  float value = 0.0;
  float amplitude = 0.5;
  for (int i = 0; i < 5; i++) {
    value += amplitude * noise(p);
    p = p * 2.03 + 11.7;
    amplitude *= 0.5;
  }
  return value;
}

void main() {
  vec2 uv = gl_FragCoord.xy / resolution;
  vec2 p = (gl_FragCoord.xy - 0.5 * resolution) / resolution.y;
  float t = time * 0.05;
  vec2 warp = vec2(fbm(p * 1.6 + vec2(0.0, t)), fbm(p * 1.6 + vec2(5.2, -t)));
  float bands = fbm(p * 2.2 + 2.5 * warp + vec2(2.0 * t, 0.0));
  vec3 color = mix(vec3(0.02, 0.03, 0.08), vec3(0.05, 0.55, 0.55), smoothstep(0.3, 0.8, bands));
  color = mix(color, vec3(0.45, 0.2, 0.75), 0.6 * smoothstep(0.55, 0.95, warp.y));
  float aspect = resolution.x / resolution.y;
  float glow = 1.0 - smoothstep(0.0, 0.35, distance(uv * vec2(aspect, 1.0), pointer * vec2(aspect, 1.0)));
  color += 0.3 * glow * vec3(0.6, 0.8, 1.0);
  color *= 0.75 + 0.25 * (1.0 - smoothstep(0.2, 1.2, length(p)));
  gl_FragColor = vec4(color, 1.0);
}`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}

if (!gl) {
  document.body.style.background = 'linear-gradient(160deg, #050814, #0d5c5c 55%, #3a1f63)';
} else {
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSource));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSource));
  gl.linkProgram(program);
  gl.useProgram(program);

  // One triangle that covers the whole screen.
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const position = gl.getAttribLocation(program, 'position');
  gl.enableVertexAttribArray(position);
  gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);

  const uniforms = {
    resolution: gl.getUniformLocation(program, 'resolution'),
    time: gl.getUniformLocation(program, 'time'),
    pointer: gl.getUniformLocation(program, 'pointer'),
  };

  function resize() {
    canvas.width = Math.round(innerWidth * scale);
    canvas.height = Math.round(innerHeight * scale);
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
  addEventListener('resize', resize);
  resize();

  // The glow eases toward the pointer; it rests in the middle until the pointer shows up.
  const target = { x: 0.5, y: 0.5 };
  const glow = { x: 0.5, y: 0.5 };
  addEventListener('pointermove', (event) => {
    target.x = event.clientX / innerWidth;
    target.y = 1 - event.clientY / innerHeight;
  });

  // Animation time advances by at most 0.1 s per frame, so after a pause the picture continues where it stopped.
  let time = 0;
  let previous = null;
  function frame(now) {
    const delta = previous === null ? 0 : Math.min((now - previous) / 1000, 0.1);
    previous = now;
    time += delta;
    glow.x += (target.x - glow.x) * Math.min(1, delta * 4);
    glow.y += (target.y - glow.y) * Math.min(1, delta * 4);
    gl.uniform2f(uniforms.resolution, canvas.width, canvas.height);
    gl.uniform1f(uniforms.time, time);
    gl.uniform2f(uniforms.pointer, glow.x, glow.y);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
